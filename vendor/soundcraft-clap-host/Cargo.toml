[package]
name = "soundcraft-clap-host"
description = "SoundCraft CLAP plugin host (vendored from the ArtCraft SoundCraft project, MIT OR Apache-2.0)"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
soundcraft-dsp = { path = "../soundcraft-dsp" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap-sys = "0.5"
libloading = "0.9"

[lints.rust]
unsafe_code = "deny"
