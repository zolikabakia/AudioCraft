[package]
name = "soundcraft-vst3-host"
description = "SoundCraft VST3 plugin host (vendored from the ArtCraft SoundCraft project, MIT OR Apache-2.0)"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
soundcraft-dsp = { path = "../soundcraft-dsp" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vst3 = "0.3"
libloading = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"
