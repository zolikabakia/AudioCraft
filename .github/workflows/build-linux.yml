name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libgtk-3-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxrandr-dev libxi-dev \
            libwayland-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/audiocraft dist/audiocraft-linux-x86_64
          chmod +x dist/audiocraft-linux-x86_64
          cp README.md LICENSE docs/COMMANDS.md dist/
          tar -czf dist/audiocraft-linux-x86_64.tar.gz -C dist \
            audiocraft-linux-x86_64 README.md LICENSE COMMANDS.md

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: audiocraft-linux-x86_64
          path: dist/
          if-no-files-found: error
